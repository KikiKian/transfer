<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Send</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0a0a0a;
            color: #e5e5e5;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        h1 {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #ffffff;
        }

        p {
            font-size: 15px;
            color: #b0b0b0;
            margin-bottom: 32px;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #a0a0a0;
            margin-bottom: 6px;
        }

        .input-wrapper {
            display: flex;
            gap: 8px;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            background-color: #1a1a1a;
            border: 1px solid #303030;
            color: #e5e5e5;
            border-radius: 6px;
            font-size: 14px;
        }

        input:focus {
            border-color: #d97706;
            outline: none;
            box-shadow: 0 0 0 3px rgba(217,119,6,0.1);
        }

        .folder-btn {
            padding: 12px 16px;
            background-color: #1a1a1a;
            border: 1px solid #303030;
            color: #b0b0b0;
            border-radius: 6px;
            cursor: pointer;
        }

        button[type="submit"] {
            width: 100%;
            padding: 14px;
            background-color: #d97706;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 8px;
        }

        .progress-container {
            display: none;
            margin-top: 28px;
        }

        .progress-bar-track {
            width: 100%;
            height: 3px;
            background-color: #303030;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: #d97706;
        }

        .graph-container {
            display: none;
            margin-top: 24px;
            background-color: #121212;
            border: 1px solid #252525;
            border-radius: 8px;

            /* FIX: required for visible chart */
            height: 300px;
            padding: 16px;
        }

        #logChart {
            width: 100% !important;
            height: 100% !important;
        }
    </style>
</head>

<body>
<div class="container">
    <h1>Send Files</h1>
    <p>Select files and a password. Enter receiver IP.</p>

    <form id="sendForm">
        <div class="form-group">
            <label>Files</label>
            <div class="input-wrapper">
                <input type="text" id="folderInput" readonly>
                <button type="button" class="folder-btn"
                        onclick="document.getElementById('folderPicker').click()">
                    Browse
                </button>
            </div>
            <input type="file" id="folderPicker" webkitdirectory multiple hidden>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password">
        </div>

        <div class="form-group">
            <label>Receiver IP</label>
            <input type="text" name="serverAddr">
        </div>

        <button type="submit">Send</button>
    </form>

    <div class="progress-container" id="progressContainer">
        <div class="progress-bar-track">
            <div class="progress-bar-fill" id="progressFill"></div>
        </div>
    </div>

    <div class="graph-container" id="graphContainer">
        <canvas id="logChart"></canvas>
    </div>

    <p id="status"></p>
</div>

<script>
const form = document.getElementById("sendForm");
const graphContainer = document.getElementById("graphContainer");
const progressContainer = document.getElementById("progressContainer");
const progressFill = document.getElementById("progressFill");
const status = document.getElementById("status");

let chartInstance = null;

function initChart() {
    const ctx = document.getElementById("logChart").getContext("2d");

    if (chartInstance) chartInstance.destroy();

    chartInstance = new Chart(ctx, {
        type: "line",
        data: {
            labels: [],
            datasets: [{
                data: [],
                borderColor: "#d97706",
                backgroundColor: "rgba(217,119,6,0.15)",
                fill: true,
                tension: 0.3
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
                x: { ticks: { color: "#888" } },
                y: {
                    min: 0,
                    max: 100,
                    ticks: { color: "#888" }
                }
            }
        }
    });
}

/* FIX: log format now matches Go JSON */
async function fetchLogData() {
    try {
        const res = await fetch("/log");
        const logs = await res.json();

        if (!chartInstance) return;

        chartInstance.data.labels =
            logs.map(l => new Date(l.time * 1000).toLocaleTimeString());

        chartInstance.data.datasets[0].data =
            logs.map(l => l.percent);

        chartInstance.update("none");
    } catch (e) {
        console.error(e);
    }
}

function setProgress(done, total) {
    const percent = total ? Math.round((done / total) * 100) : 0;
    progressFill.style.width = percent + "%";
}

form.addEventListener("submit", async (e) => {
    e.preventDefault();

    graphContainer.style.display = "block";
    progressContainer.style.display = "block";

    initChart();

    const logInterval = setInterval(fetchLogData, 1000);
    const es = new EventSource("/progress");

    es.onmessage = (event) => {
        const [done, total] = event.data.split("/").map(Number);
        setProgress(done, total);
    };

    const res = await fetch("/send", {
        method: "POST",
        body: new FormData(form)
    });

    const msg = await res.text();

    es.close();
    clearInterval(logInterval);

    await fetchLogData();

    status.textContent = msg;
});
</script>
</body>
</html>
