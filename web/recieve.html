<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Receive</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0a0a0a;
            color: white;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .card {
            background-color: #111;
            border: 1px solid #222;
            border-radius: 12px;
            padding: 40px;
            width: 380px;
            box-shadow: 0 0 40px rgba(255,255,255,0.03);
        }

        h1 {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 24px;
            letter-spacing: 0.5px;
        }

        .folder-row {
            display: flex;
            gap: 8px;
            margin: 10px 0;
        }

        .folder-row input {
            flex: 1;
            margin: 0;
        }

        .folder-btn {
            padding: 10px 14px;
            background-color: #1a1a1a;
            border: 1px solid #333;
            color: #aaa;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
            transition: border 0.2s, color 0.2s;
            margin: 0;
            width: auto;
        }

        .folder-btn:hover {
            border-color: #555;
            color: white;
            background-color: #1a1a1a;
        }

        input {
            display: block;
            width: 100%;
            margin: 10px 0;
            padding: 10px 14px;
            background-color: #1a1a1a;
            border: 1px solid #333;
            color: white;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border 0.2s;
        }

        input:focus {
            border-color: #555;
        }

        button[type="submit"] {
            margin-top: 20px;
            width: 100%;
            padding: 11px;
            background-color: #c4622d;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button[type="submit"]:hover {
            background-color: #ad5427;
        }

        button[type="submit"]:disabled {
            background-color: #444;
            color: #888;
            cursor: not-allowed;
        }

        .progress-container {
            display: none;
            margin-top: 20px;
        }

        .progress-bar-track {
            width: 100%;
            height: 4px;
            background-color: #222;
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background-color: #c4622d;
            border-radius: 2px;
            transition: width 0.3s ease;
        }

        .progress-label {
            margin-top: 8px;
            font-size: 12px;
            color: #555;
            text-align: right;
        }

        #status {
            margin-top: 14px;
            font-size: 13px;
            color: #666;
            min-height: 18px;
            text-align: center;
        }

        a {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #444;
            font-size: 13px;
            text-decoration: none;
            transition: color 0.2s;
        }

        a:hover {
            color: #888;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Receive Files</h1>
        <form id="receiveForm">
            <div class="folder-row">
                <input type="text" name="outputFolder" id="folderInput" placeholder="Output folder path" />
                <button type="button" class="folder-btn" onclick="document.getElementById('folderPicker').click()">Browse</button>
            </div>
            <input type="file" id="folderPicker" webkitdirectory style="display:none" />
            <input type="password" name="password" placeholder="Password" />
            <button type="submit" id="receiveBtn">Receive</button>
        </form>
        <div class="progress-container" id="progressContainer">
            <div class="progress-bar-track">
                <div class="progress-bar-fill" id="progressFill"></div>
            </div>
            <div class="progress-label" id="progressLabel">Waiting...</div>
        </div>
        <p id="status"></p>
        <a href="/send.html">Go to Send</a>
    </div>

    <script>
        // Folder picker — shows folder name in input (browser can't give full path)
        document.getElementById("folderPicker").addEventListener("change", (e) => {
            const files = e.target.files
            if (files.length > 0) {
                const path = files[0].webkitRelativePath.split("/")[0]
                document.getElementById("folderInput").value = path
            }
        })

        const form = document.getElementById("receiveForm")
        const status = document.getElementById("status")
        const btn = document.getElementById("receiveBtn")
        const progressContainer = document.getElementById("progressContainer")
        const progressFill = document.getElementById("progressFill")
        const progressLabel = document.getElementById("progressLabel")

        form.addEventListener("submit", async (e) => {
            e.preventDefault()
            btn.disabled = true
            btn.textContent = "Waiting..."
            status.textContent = ""
            progressContainer.style.display = "block"
            progressFill.style.width = "0%"
            progressLabel.textContent = "Waiting for connection..."

            const response = await fetch("/read", {
                method: "POST",
                body: new FormData(form)
            })
            const message = await response.text()

            progressFill.style.width = "100%"
            progressLabel.textContent = "Done"
            status.textContent = message
            btn.disabled = false
            btn.textContent = "Receive"
        })
    </script>
</body>
</html>
