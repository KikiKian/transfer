<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Transfer</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0a0a0a;
            color: white;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .wrap {
            width: 380px;
        }

        h1 {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 6px;
            color: #c4622d;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        p {
            font-size: 13px;
            color: #555;
            line-height: 1.7;
            margin-bottom: 32px;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 32px;
        }

        a.btn {
            flex: 1;
            padding: 11px;
            font-size: 13px;
            font-family: monospace;
            font-weight: bold;
            text-decoration: none;
            text-align: center;
            border: 1px solid #333;
            transition: border-color 0.2s, color 0.2s, background 0.2s;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        a.btn-primary {
            background-color: #c4622d;
            color: white;
            border-color: #c4622d;
        }

        a.btn-primary:hover {
            background-color: #ad5427;
            border-color: #ad5427;
        }

        a.btn-secondary {
            background-color: transparent;
            color: #666;
        }

        a.btn-secondary:hover {
            color: white;
            border-color: #666;
        }

        .links {
            border-top: 1px solid #1e1e1e;
            padding-top: 20px;
            display: flex;
            gap: 20px;
        }

        .links a {
            font-size: 12px;
            color: #c4622d;
            text-decoration: none;
            opacity: 0.7;
            transition: opacity 0.2s;
        }

        .links a:hover {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <h1>Transfer</h1>
        <p>Send folders between computers on your network. Files are compressed and encrypted with a password you choose.</p>
        <div class="buttons">
            <a href="/send.html" class="btn btn-primary">Send</a>
            <a href="/recieve.html" class="btn btn-secondary">Receive</a>
        </div>
        <div class="links">
            <a href="https://github.com/kikikian" target="_blank">github.com/kikikian</a>
            <a href="https://codeberg.org/kikikian" target="_blank">codeberg.org/kikikian</a>
        </div>
    </div>
</body>
</html>
