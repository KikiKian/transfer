<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Receive</title>

    <!-- FIX: Chart.js added -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0a0a0a;
            color: #e5e5e5;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        h1 {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #ffffff;
        }

        p {
            font-size: 15px;
            color: #b0b0b0;
            margin-bottom: 32px;
            line-height: 1.6;
        }

        .ip-display {
            font-size: 13px;
            color: #b0b0b0;
            margin-bottom: 32px;
            padding: 14px;
            background-color: #151515;
            border-left: 3px solid #d97706;
            border-radius: 4px;
        }

        #localIP {
            color: #d97706;
            font-weight: 600;
            font-family: monospace;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #a0a0a0;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            background-color: #1a1a1a;
            border: 1px solid #303030;
            color: #e5e5e5;
            border-radius: 6px;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 8px;
            background-color: #d97706;
            border: none;
            color: white;
            border-radius: 6px;
            cursor: pointer;
        }

        .progress-container {
            display: none;
            margin-top: 28px;
        }

        .progress-bar-track {
            width: 100%;
            height: 3px;
            background-color: #303030;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #d97706, #f59e0b);
        }

        /* ================= GRAPH ADDED ================= */
        .graph-container {
            display: none;
            margin-top: 24px;
            padding: 16px;
            background-color: #121212;
            border: 1px solid #252525;
            border-radius: 8px;
            height: 300px;
        }

        #logChart {
            width: 100% !important;
            height: 100% !important;
        }
    </style>
</head>

<body>
<div class="container">
    <h1>Receive Files</h1>
    <p>Share your IP with the sender. Set password and wait.</p>

    <div class="ip-display">
        Your IP: <span id="localIP">detecting...</span>:8080
    </div>

    <form id="acceptForm">
        <div class="form-group">
            <label>Files destination</label>
            <input type="text" name="outputFolder" placeholder="Folder name">
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password">
        </div>

        <button type="submit" id="acceptBtn">Receive</button>
    </form>

    <div class="progress-container" id="progressContainer">
        <div class="progress-bar-track">
            <div class="progress-bar-fill" id="progressFill"></div>
        </div>
    </div>

    <!-- ================= GRAPH ADDED ================= -->
    <div class="graph-container" id="graphContainer">
        <canvas id="logChart"></canvas>
    </div>

    <p id="status"></p>
</div>

<script>
fetch("/localip")
    .then(r => r.text())
    .then(ip => {
        document.getElementById("localIP").textContent = ip;
    });

const form = document.getElementById("acceptForm");
const btn = document.getElementById("acceptBtn");
const status = document.getElementById("status");

const progressContainer = document.getElementById("progressContainer");
const progressFill = document.getElementById("progressFill");

const graphContainer = document.getElementById("graphContainer");

let chartInstance = null;

/* ================= GRAPH LOGIC ================= */

function initChart() {
    const ctx = document.getElementById("logChart").getContext("2d");

    if (chartInstance) chartInstance.destroy();

    chartInstance = new Chart(ctx, {
        type: "line",
        data: {
            labels: [],
            datasets: [{
                data: [],
                borderColor: "#d97706",
                backgroundColor: "rgba(217,119,6,0.15)",
                fill: true,
                tension: 0.3,
                pointRadius: 2
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
                x: { ticks: { color: "#888" } },
                y: {
                    min: 0,
                    max: 100,
                    ticks: { color: "#888" }
                }
            }
        }
    });
}

/* FIX: live log polling */
async function fetchLogData() {
    try {
        const res = await fetch("/log");
        const logs = await res.json();

        if (!chartInstance) return;

        chartInstance.data.labels =
            logs.map(l => new Date(l.time * 1000).toLocaleTimeString());

        chartInstance.data.datasets[0].data =
            logs.map(l => l.percent);

        chartInstance.update("none");
    } catch (e) {
        console.error(e);
    }
}

/* ================= FORM ================= */

form.addEventListener("submit", async (e) => {
    e.preventDefault();

    btn.disabled = true;
    btn.textContent = "Listening...";

    progressContainer.style.display = "block";
    graphContainer.style.display = "block";

    initChart();

    const logInterval = setInterval(fetchLogData, 1000);

    const response = await fetch("/read", {
        method: "POST",
        body: new FormData(form)
    });

    const message = await response.text();

    clearInterval(logInterval);
    await fetchLogData();

    progressFill.style.width = "100%";
    status.textContent = message;

    btn.disabled = false;
    btn.textContent = "Receive";
});
</script>
</body>
</html>
